name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew :ktor-server:test :ktor-client:jvmTest
      - name: Compile sample
        run: ./gradlew :sample:contracts:compileKotlin :sample:server:compileKotlin :sample:client:compileKotlin
